<svg
    xmlns="http://www.w3.org/2000/svg"
    width="800"
    height="330"
    viewBox="0 0 800 330"
    role="img"
    aria-label="Neofetch style developer information card"
>
    <style>
        .title {
            font: bold 22px monospace;
            fill: #58a6ff;
        }

        .label {
            font: bold 18px monospace;
            fill: #f0f6fc;
        }

        .value {
            font: 18px monospace;
            fill: #c9d1d9;
        }

        .cursor {
            fill: #58a6ff;
        }
    </style>

    <!-- Background -->
    <rect
        x="10"
        y="10"
        width="780"
        height="310"
        rx="18"
        fill="#0d1117"
        stroke="#30363d"
        stroke-width="2"
    />

    <!-- Top bar -->
    <rect
        x="10"
        y="10"
        width="780"
        height="55"
        rx="18"
        fill="#161b22"
    />

    <!-- Bottom of top bar -->
    <rect
        x="10"
        y="47"
        width="780"
        height="18"
        fill="#161b22"
    />

    <!-- Window buttons -->
    <circle cx="42" cy="37" r="8" fill="#ff5f56"/>
    <circle cx="68" cy="37" r="8" fill="#ffbd2e"/>
    <circle cx="94" cy="37" r="8" fill="#27c93f"/>

    <!-- Title -->
    <text x="125" y="44" class="title">
        reiidon@github
    </text>

    <!-- Left ASCII decoration -->
    <text
        x="70"
        y="120"
        font-family="monospace"
        font-size="18"
        fill="#58a6ff"
        opacity="0.9"
    >
        <tspan x="70" dy="0">   ███████   </tspan>
        <tspan x="70" dy="22"> ██       ██ </tspan>
        <tspan x="70" dy="22">██   ◉ ◉   ██</tspan>
        <tspan x="70" dy="22">██     &gt;   ██</tspan>
        <tspan x="70" dy="22"> ██  ───  ██ </tspan>
        <tspan x="70" dy="22">   ███████   </tspan>
    </text>

    <g opacity="0">
        <animate
            attributeName="opacity"
            values="0;0;1"
            keyTimes="0;0.5;1"
            dur="1.1s"
            begin="0.0s"
            fill="freeze"
        />

        <animateTransform
            attributeName="transform"
            type="translate"
            values="20 0;20 0;0 0"
            keyTimes="0;0.5;1"
            dur="1.1s"
            begin="0.0s"
            fill="freeze"
        />

        <text x="310" y="110" class="label">
            Now
        </text>

        <text x="430" y="110" class="value">
            Building AI-powered applications
        </text>
    </g>

    <g opacity="0">
        <animate
            attributeName="opacity"
            values="0;0;1"
            keyTimes="0;0.5;1"
            dur="1.1s"
            begin="0.55s"
            fill="freeze"
        />

        <animateTransform
            attributeName="transform"
            type="translate"
            values="20 0;20 0;0 0"
            keyTimes="0;0.5;1"
            dur="1.1s"
            begin="0.55s"
            fill="freeze"
        />

        <text x="310" y="155" class="label">
            Prev
        </text>

        <text x="430" y="155" class="value">
            Computer Science student
        </text>
    </g>

    <g opacity="0">
        <animate
            attributeName="opacity"
            values="0;0;1"
            keyTimes="0;0.5;1"
            dur="1.1s"
            begin="1.1s"
            fill="freeze"
        />

        <animateTransform
            attributeName="transform"
            type="translate"
            values="20 0;20 0;0 0"
            keyTimes="0;0.5;1"
            dur="1.1s"
            begin="1.1s"
            fill="freeze"
        />

        <text x="310" y="200" class="label">
            Stack
        </text>

        <text x="430" y="200" class="value">
            Python • FastAPI • React • AI
        </text>
    </g>

    <g opacity="0">
        <animate
            attributeName="opacity"
            values="0;0;1"
            keyTimes="0;0.5;1"
            dur="1.1s"
            begin="1.6500000000000001s"
            fill="freeze"
        />

        <animateTransform
            attributeName="transform"
            type="translate"
            values="20 0;20 0;0 0"
            keyTimes="0;0.5;1"
            dur="1.1s"
            begin="1.6500000000000001s"
            fill="freeze"
        />

        <text x="310" y="245" class="label">
            Highlights
        </text>

        <text x="430" y="245" class="value">
            AI • Computer Vision • RAG
        </text>
    </g>

    <rect
        x="310"
        y="265"
        width="14"
        height="22"
        rx="2"
        class="cursor"
        opacity="0"
    >
        <animate
            attributeName="opacity"
            values="0;0;1;1;0;0"
            keyTimes="0;0.45;0.5;0.7;0.75;1"
            dur="1.2s"
            begin="2.2s"
            repeatCount="indefinite"
        />
    </rect>

    <!-- Footer -->
    <text
        x="310"
        y="285"
        font-family="monospace"
        font-size="14"
        fill="#8b949e"
        opacity="0"
    >
        $ whoami
        <animate
            attributeName="opacity"
            from="0"
            to="1"
            dur="0.6s"
            begin="2.7s"
            fill="freeze"
        />
    </text>

    <text
        x="400"
        y="285"
        font-family="monospace"
        font-size="14"
        fill="#3fb950"
        opacity="0"
    >
        developer
        <animate
            attributeName="opacity"
            from="0"
            to="1"
            dur="0.6s"
            begin="3.3000000000000003s"
            fill="freeze"
        />
    </text>

</svg>
