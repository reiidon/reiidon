    <animateTransform
        attributeName="transform"
        type="translate"
        values="25 0;25 0;0 0"
        keyTimes="0;0.4;1"
        dur="0.9s"
        begin="0.0s"
        fill="freeze"
    />

    <text
        x="330"
        y="200"
        class="label"
