        Building AI-powered applications
    </text>

    <line
        x1="330"
        y1="255"
        x2="710"
        y2="255"
        stroke="#21262d"
        stroke-width="1"
    />

</g>


<g opacity="0">

    <animate
        attributeName="opacity"
        values="0;0;1"
        keyTimes="0;0.4;1"
        dur="0.9s"
        begin="0.45s"
        fill="freeze"
    />

    <animateTransform
        attributeName="transform"
        type="translate"
        values="25 0;25 0;0 0"
        keyTimes="0;0.4;1"
        dur="0.9s"
        begin="0.45s"
        fill="freeze"
    />

    <text
        x="330"
        y="282"
        class="label"
    >
        PREV
    </text>

    <text
        x="330"
        y="316"
        class="value"
    >
        Computer Science student
    </text>

    <line
        x1="330"
        y1="337"
        x2="710"
        y2="337"
        stroke="#21262d"
        stroke-width="1"
    />

</g>


<g opacity="0">

    <animate
        attributeName="opacity"
        values="0;0;1"
        keyTimes="0;0.4;1"
        dur="0.9s"
        begin="0.9s"
        fill="freeze"
    />

    <animateTransform
        attributeName="transform"
        type="translate"
        values="25 0;25 0;0 0"
        keyTimes="0;0.4;1"
        dur="0.9s"
        begin="0.9s"
        fill="freeze"
    />

    <text
        x="330"
        y="364"
        class="label"
    >
        STACK
    </text>

    <text
        x="330"
        y="398"
        class="value"
    >
        Python • FastAPI • React • AI
    </text>

    <line
        x1="330"
        y1="419"
        x2="710"
        y2="419"
        stroke="#21262d"
        stroke-width="1"
    />

</g>


<g opacity="0">

    <animate
        attributeName="opacity"
        values="0;0;1"
        keyTimes="0;0.4;1"
        dur="0.9s"
        begin="1.35s"
        fill="freeze"
    />

    <animateTransform
        attributeName="transform"
        type="translate"
        values="25 0;25 0;0 0"
        keyTimes="0;0.4;1"
        dur="0.9s"
        begin="1.35s"
        fill="freeze"
    />

    <text
        x="330"
        y="446"
        class="label"
