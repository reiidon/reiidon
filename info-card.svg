<svg
    xmlns="http://www.w3.org/2000/svg"
    width="800"
    height="720"
    viewBox="0 0 800 720"
    role="img"
    aria-label="Developer information card"
>

<style>

.title {
    font-family: monospace;
    font-size: 24px;
    font-weight: bold;
    fill: #58a6ff;
}

.subtitle {
    font-family: monospace;
    font-size: 14px;
    fill: #8b949e;
}

.label {
    font-family: monospace;
    font-size: 17px;
    font-weight: bold;
    fill: #58a6ff;
}

.value {
    font-family: monospace;
    font-size: 17px;
    fill: #c9d1d9;
}

.section {
    font-family: monospace;
    font-size: 13px;
    letter-spacing: 2px;
    fill: #8b949e;
}

.footer {
    font-family: monospace;
    font-size: 15px;
    fill: #8b949e;
}

.green {
    font-family: monospace;
    font-size: 15px;
    fill: #3fb950;
}

</style>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect
    x="10"
    y="10"
    width="780"
    height="700"
    rx="22"
    fill="#0d1117"
    stroke="#30363d"
    stroke-width="2"
/>


<!-- ================================================= -->
<!-- TERMINAL HEADER -->
<!-- ================================================= -->

<rect
    x="10"
    y="10"
    width="780"
    height="72"
    rx="22"
    fill="#161b22"
/>

<rect
    x="10"
    y="50"
    width="780"
    height="32"
    fill="#161b22"
/>


<!-- WINDOW BUTTONS -->

<circle cx="42" cy="45" r="9" fill="#ff5f56"/>
<circle cx="70" cy="45" r="9" fill="#ffbd2e"/>
<circle cx="98" cy="45" r="9" fill="#27c93f"/>


<!-- TERMINAL TITLE -->

<text
    x="135"
    y="52"
    class="title"
>
    reiidon@github
</text>


<!-- ================================================= -->
<!-- LEFT SIDE VISUAL -->
<!-- ================================================= -->

<text
    x="75"
    y="175"
    font-family="monospace"
    font-size="24"
    fill="#58a6ff"
>
    <tspan x="75" dy="0">   ███████   </tspan>
    <tspan x="75" dy="28"> ██       ██ </tspan>
    <tspan x="75" dy="28">██   ◉ ◉   ██</tspan>
    <tspan x="75" dy="28">██    ▬    ██</tspan>
    <tspan x="75" dy="28"> ██  ───  ██ </tspan>
    <tspan x="75" dy="28">   ███████   </tspan>
</text>


<!-- LEFT SIDE DIVIDER -->

<line
    x1="285"
    y1="130"
    x2="285"
    y2="590"
    stroke="#21262d"
    stroke-width="2"
/>


<!-- ================================================= -->
<!-- LEFT SIDE DETAILS -->
<!-- ================================================= -->

<text
    x="75"
    y="390"
    class="section"
>
    PROFILE
</text>

<text
    x="75"
    y="435"
    class="value"
>
    AI Developer
</text>

<text
    x="75"
    y="470"
    class="value"
>
    Python Developer
</text>

<text
    x="75"
    y="505"
    class="value"
>
    Builder
</text>


<!-- STATUS -->

<circle
    cx="84"
    cy="565"
    r="7"
    fill="#3fb950"
>
    <animate
        attributeName="opacity"
        values="1;0.35;1"
        dur="2s"
        repeatCount="indefinite"
    />
</circle>

<text
    x="105"
    y="570"
    class="subtitle"
>
    online • building
</text>


<!-- ================================================= -->
<!-- RIGHT SIDE HEADER -->
<!-- ================================================= -->

<text
    x="330"
    y="135"
    class="section"
>
    DEVELOPER STATUS
</text>


<!-- ================================================= -->
<!-- INFO ROWS -->
<!-- ================================================= -->


<g opacity="0">

    <animate
