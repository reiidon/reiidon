    </text>

    <line
        x1="330"
        y1="501"
        x2="710"
        y2="501"
        stroke="#21262d"
        stroke-width="1"
    />

</g>


<!-- ================================================= -->
<!-- TERMINAL FOOTER -->
<!-- ================================================= -->

<rect
    x="45"
    y="625"
    width="710"
    height="55"
    rx="12"
    fill="#161b22"
    stroke="#21262d"
    stroke-width="1"
/>

<text
    x="75"
    y="660"
    class="footer"
>
    $ whoami
</text>

<text
    x="210"
    y="660"
    class="green"
>
    developer
</text>

<rect
    x="330"
    y="642"
    width="11"
    height="22"
    rx="2"
    fill="#58a6ff"
>
    <animate
        attributeName="opacity"
        values="1;1;0;0;1"
        keyTimes="0;0.45;0.5;0.95;1"
        dur="1.2s"
        repeatCount="indefinite"
