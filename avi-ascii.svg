<style>

.ascii {
    font-family: monospace;
    font-size: 7px;
    font-weight: 400;
    fill: #c9d1d9;
}

.row {
    opacity: 0;
    animation:
        appear
        0.1s
        forwards;
}

@keyframes appear {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}

</style>

<rect
width="100%"
height="100%"
rx="12"
fill="#0d1117"
/>

